<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>基金持仓与涨幅对比工具</title>

  <!-- 图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Excel 导出库 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f8fc;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: #1d4ed8;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 15px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      border: 1px solid #e5edf7;
    }

    .input-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    input {
      flex: 1;
      min-width: 280px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: #10b981;
    }

    .secondary-btn:hover {
      background: #059669;
    }

    .light-btn {
      background: #e0ecff;
      color: #1d4ed8;
    }

    .light-btn:hover {
      background: #c7ddff;
    }

    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      margin-top: 14px;
      color: #2563eb;
      font-weight: 500;
      font-size: 14px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
      background: #ffffff;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 600;
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid #dbeafe;
      font-size: 14px;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: top;
      font-size: 14px;
      color: #334155;
    }

    tr:hover td {
      background: #f8fbff;
    }

    .fund-name {
      font-weight: 600;
      color: #0f172a;
    }

    .code {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e0ecff;
      color: #1d4ed8;
      font-size: 12px;
    }

    .positive {
      color: #059669;
      font-weight: 700;
    }

    .negative {
      color: #dc2626;
      font-weight: 700;
    }

    .empty {
      color: #94a3b8;
    }

    .chart-box {
      height: 380px;
      margin-top: 10px;
    }

    canvas {
      background: #ffffff;
      border-radius: 12px;
    }

    .summary {
      line-height: 1.8;
      color: #475569;
      font-size: 15px;
    }

    .summary strong {
      color: #1d4ed8;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      .header h1 {
        font-size: 24px;
      }

      button {
        width: 100%;
      }

      input {
        min-width: 100%;
      }

      .chart-box {
        height: 320px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📈 基金持仓与涨幅对比工具</h1>
    <p>输入多个基金代码，自动抓取基金名称、近一个月涨幅及前五大持仓，并生成对比表和图表。</p>
  </div>

  <div class="card">
    <h3>输入基金代码</h3>

    <div class="input-area">
      <input
        id="fundCodes"
        placeholder="例如：012348,161725,000001"
      />

      <button onclick="loadFunds()">确定</button>

      <button class="secondary-btn" onclick="exportExcel()">导出 Excel</button>

      <button class="light-btn" onclick="exportCSV()">导出 CSV</button>
    </div>

    <div class="hint">
      多个基金代码请使用英文逗号 <strong>,</strong> 分隔。  
      示例：<strong>012348,161725,000001</strong>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>📋 基金对比表</h2>
    <div id="tableContainer"></div>
  </div>

  <div class="card">
    <h2>📊 近一个月涨幅比较</h2>
    <div class="chart-box">
      <canvas id="growthChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>🤖 简易分析摘要</h2>
    <div id="summary" class="summary">
      请输入基金代码后点击“确定”生成分析。
    </div>
  </div>

</div>

<script>
  let fundData = [];
  let growthChart = null;

  const proxyList = [
    function(url) {
      return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
    },
    function(url) {
      return "https://corsproxy.io/?" + encodeURIComponent(url);
    }
  ];

  function cleanText(text) {
    return (text || "")
      .replace(/\s+/g, " ")
      .replace(/[\r\n\t]/g, "")
      .trim();
  }

  async function fetchWithFallback(url) {
    for (const proxy of proxyList) {
      try {
        const response = await fetch(proxy(url));

        if (!response.ok) {
          continue;
        }

        const text = await response.text();

        if (text && text.length > 20) {
          return text;
        }
      } catch (error) {
        console.log("代理失败，尝试下一个：", error);
      }
    }

    throw new Error("所有抓取方式均失败");
  }

  async function fetchJsonWithFallback(url) {
    const text = await fetchWithFallback(url);

    try {
      return JSON.parse(text);
    } catch (error) {
      throw new Error("JSON解析失败");
    }
  }

  async function getFundBasicInfo(code) {
    const url =
      "https://fundmobapi.eastmoney.com/FundMApi/FundBaseTypeInformation?FCODE=" +
      code;

    try {
      const json = await fetchJsonWithFallback(url);
      const data = json.Datas || {};

      return {
        name: data.SHORTNAME || data.FNAME || "基金" + code,
        growth: parseFloat(data.NAVGRL1 || data.SYLD || data.RZDF || 0)
      };
    } catch (error) {
      console.log("基础信息接口失败：", code, error);

      return {
        name: "基金" + code,
        growth: null
      };
    }
  }

  async function getFundHoldings(code) {
    const apiUrl =
      "https://fundmobapi.eastmoney.com/FundMApi/FundMNInverstPosition?FCODE=" +
      code +
      "&pageIndex=1&pageSize=5";

    try {
      const json = await fetchJsonWithFallback(apiUrl);
      const list = json.Datas || [];

      if (list.length > 0) {
        return list.slice(0, 5).map(function(item) {
          return {
            stock: cleanText(item.GPJC || item.GPDM || item.SECCODE || "未知持仓"),
            ratio: cleanText(item.JZBL || item.PCTNVCHG || item.ZJZBL || "")
          };
        });
      }
    } catch (error) {
      console.log("持仓接口失败，尝试网页解析：", code, error);
    }

    return await getFundHoldingsFromPage(code);
  }

  async function getFundHoldingsFromPage(code) {
    const pageUrl = "https://fundf10.eastmoney.com/jjcc_" + code + ".html";

    try {
      const html = await fetchWithFallback(pageUrl);
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      const rows = Array.from(doc.querySelectorAll("table tbody tr"));
      const holdings = [];

      rows.forEach(function(row) {
        if (holdings.length >= 5) {
          return;
        }

        const cells = Array.from(row.querySelectorAll("td")).map(function(td) {
          return cleanText(td.innerText);
        });

        if (cells.length >= 6) {
          const stockName = cells[1] || cells[2] || "";
          const ratio = cells.find(function(x) {
            return x.includes("%");
          }) || "";

          if (stockName && ratio) {
            holdings.push({
              stock: stockName,
              ratio: ratio
            });
          }
        }
      });

      return holdings;
    } catch (error) {
      console.log("网页持仓解析失败：", code, error);
      return [];
    }
  }

  async function loadFunds() {
    const input = document.getElementById("fundCodes").value;

    const codes = input
      .split(",")
      .map(function(x) {
        return x.trim();
      })
      .filter(function(x) {
        return x;
      });

    if (codes.length === 0) {
      alert("请输入基金代码，例如：012348,161725,000001");
      return;
    }

    fundData = [];
    document.getElementById("status").innerHTML =
      "⏳ 正在抓取基金数据，请稍候...";

    for (let i = 0; i < codes.length; i++) {
      const code = codes[i];

      document.getElementById("status").innerHTML =
        "⏳ 正在抓取第 " + (i + 1) + " / " + codes.length + " 支基金：" + code;

      const basicInfo = await getFundBasicInfo(code);
      const holdings = await getFundHoldings(code);

      fundData.push({
        code: code,
        name: basicInfo.name,
        growth: basicInfo.growth,
        holdings: holdings
      });
    }

    renderTable();
    renderChart();
    renderSummary();

    document.getElementById("status").innerHTML =
      "✅ 数据抓取完成，共分析 " + fundData.length + " 支基金";
  }

  function renderTable() {
    if (fundData.length === 0) {
      document.getElementById("tableContainer").innerHTML =
        '<p class="empty">暂无数据。</p>';
      return;
    }

    let html = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>基金名称</th>
              <th>基金代码</th>
              <th>近一个月涨幅</th>
              <th>持仓1</th>
              <th>比例1</th>
              <th>持仓2</th>
              <th>比例2</th>
              <th>持仓3</th>
              <th>比例3</th>
              <th>持仓4</th>
              <th>比例4</th>
              <th>持仓5</th>
              <th>比例5</th>
            </tr>
          </thead>
          <tbody>
    `;

    fundData.forEach(function(fund) {
      const holdings = fund.holdings || [];

      const growthDisplay =
        fund.growth === null || isNaN(fund.growth)
          ? '<span class="empty">暂无数据</span>'
          : `<span class="${fund.growth >= 0 ? "positive" : "negative"}">${fund.growth.toFixed(2)}%</span>`;

      html += `
        <tr>
          <td>
            <div class="fund-name">${fund.name}</div>
          </td>
          <td>
            <span class="code">${fund.code}</span>
          </td>
          <td>${growthDisplay}</td>
      `;

      for (let i = 0; i < 5; i++) {
        const item = holdings[i];

        if (item) {
          html += `
            <td>${item.stock}</td>
            <td>${item.ratio}</td>
          `;
        } else {
          html += `
            <td class="empty">暂无</td>
            <td class="empty">暂无</td>
          `;
        }
      }

      html += `</tr>`;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    document.getElementById("tableContainer").innerHTML = html;
  }

  function renderChart() {
    const ctx = document.getElementById("growthChart");

    const labels = fundData.map(function(fund) {
      return fund.name || fund.code;
    });

    const data = fundData.map(function(fund) {
      return fund.growth === null || isNaN(fund.growth) ? 0 : fund.growth;
    });

    if (growthChart) {
      growthChart.destroy();
    }

    growthChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            label: "近一个月涨幅 (%)",
            data: data,
            backgroundColor: [
              "#60a5fa",
              "#34d399",
              "#fbbf24",
              "#f472b6",
              "#a78bfa",
              "#38bdf8",
              "#fb7185",
              "#4ade80"
            ],
            borderRadius: 8
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return "近一个月涨幅：" + context.raw + "%";
              }
            }
          }
        },
        scales: {
          y: {
            ticks: {
              callback: function(value) {
                return value + "%";
              }
            }
          }
        }
      }
    });
  }

  function renderSummary() {
    if (fundData.length === 0) {
      document.getElementById("summary").innerHTML =
        "请输入基金代码后点击“确定”生成分析。";
      return;
    }

    const validGrowth = fundData
      .map(function(fund) {
        return fund.growth;
      })
      .filter(function(x) {
        return x !== null && !isNaN(x);
      });

    const avgGrowth =
      validGrowth.length > 0
        ? validGrowth.reduce(function(a, b) {
            return a + b;
          }, 0) / validGrowth.length
        : null;

    const stockCounter = {};

    fundData.forEach(function(fund) {
      fund.holdings.forEach(function(item) {
        if (!stockCounter[item.stock]) {
          stockCounter[item.stock] = 0;
        }

        stockCounter[item.stock]++;
      });
    });

    const overlapStocks = Object.entries(stockCounter)
      .filter(function(item) {
        return item[1] >= 2;
      })
      .map(function(item) {
        return item[0];
      });

    let bestFund = null;

    fundData.forEach(function(fund) {
      if (fund.growth !== null && !isNaN(fund.growth)) {
        if (!bestFund || fund.growth > bestFund.growth) {
          bestFund = fund;
        }
      }
    });

    document.getElementById("summary").innerHTML = `
      <p>✅ 当前共分析 <strong>${fundData.length}</strong> 支基金。</p>

      <p>
        📈 平均近一个月涨幅：
        <strong>
          ${avgGrowth === null ? "暂无数据" : avgGrowth.toFixed(2) + "%"}
        </strong>
      </p>

      <p>
        🏆 近一个月表现较好的基金：
        <strong>
          ${bestFund ? bestFund.name + "（" + bestFund.growth.toFixed(2) + "%）" : "暂无数据"}
        </strong>
      </p>

      <p>
        🔁 多基金共同重仓股：
        <strong>
          ${overlapStocks.length > 0 ? overlapStocks.join("、") : "暂无明显重合"}
        </strong>
      </p>

      <p>
        🤖 简易判断：
        如果多个基金前五持仓高度重合，说明组合分散度可能不足；
        如果近一个月涨幅差异较大，建议结合基金行业主题、波动率和长期表现进一步比较。
      </p>
    `;
  }

  function exportExcel() {
    if (fundData.length === 0) {
      alert("请先点击“确定”生成数据");
      return;
    }

    const rows = fundData.map(function(fund) {
      const row = {
        基金名称: fund.name,
        基金代码: fund.code,
        近一个月涨幅:
          fund.growth === null || isNaN(fund.growth)
            ? "暂无数据"
            : fund.growth.toFixed(2) + "%"
      };

      for (let i = 0; i < 5; i++) {
        const item = fund.holdings[i];

        row["持仓" + (i + 1)] = item ? item.stock : "";
        row["比例" + (i + 1)] = item ? item.ratio : "";
      }

      return row;
    });

    if (typeof XLSX === "undefined") {
      alert("Excel导出组件加载失败，请使用CSV导出");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "基金对比");
    XLSX.writeFile(wb, "基金持仓与涨幅对比.xlsx");
  }

  function exportCSV() {
    if (fundData.length === 0) {
      alert("请先点击“确定”生成数据");
      return;
    }

    const headers = [
      "基金名称",
      "基金代码",
      "近一个月涨幅",
      "持仓1",
      "比例1",
      "持仓2",
      "比例2",
      "持仓3",
      "比例3",
      "持仓4",
      "比例4",
      "持仓5",
      "比例5"
    ];

    const rows = fundData.map(function(fund) {
      const row = [
        fund.name,
        fund.code,
        fund.growth === null || isNaN(fund.growth)
          ? "暂无数据"
          : fund.growth.toFixed(2) + "%"
      ];

      for (let i = 0; i < 5; i++) {
        const item = fund.holdings[i];

        row.push(item ? item.stock : "");
        row.push(item ? item.ratio : "");
      }

      return row;
    });

    let csv = headers.join(",") + "\n";

    rows.forEach(function(row) {
      csv +=
        row
          .map(function(value) {
            return '"' + String(value).replace(/"/g, '""') + '"';
          })
          .join(",") + "\n";
    });

    const blob = new Blob(["\ufeff" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "基金持仓与涨幅对比.csv";
    link.click();
  }

  document.getElementById("fundCodes").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      loadFunds();
    }
  });
</script>

</body>
</html>
