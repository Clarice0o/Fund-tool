<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fund Tool - 基金查询工具</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .desc {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
    }

    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
    }

    .positive {
      color: #dc2626;
      font-weight: 700;
    }

    .negative {
      color: #16a34a;
      font-weight: 700;
    }

    .neutral {
      color: #4b5563;
      font-weight: 700;
    }

    .tag-ok {
      background: #dcfce7;
      color: #166534;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    .tag-fail {
      background: #fee2e2;
      color: #991b1b;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    .note {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Fund Tool - 基金查询工具</h1>

      <div class="desc">
        输入一个或多个基金代码，查询天天基金公开实时估值数据，并支持导出 CSV。
        <br />
        多个代码可以用逗号、空格或换行分隔，例如：012348, 000001, 161725
      </div>

      <textarea id="fundCodes" placeholder="请输入基金代码，例如：012348, 000001, 161725"></textarea>

      <div class="buttons">
        <button class="primary" id="queryBtn" onclick="loadFunds()">查询基金</button>
        <button class="secondary" id="exportBtn" onclick="exportCSV()" disabled>导出 CSV</button>
        <button class="danger" onclick="clearAll()">清空</button>
      </div>

      <div id="statusBox" class="status"></div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <h2 style="font-size:18px;margin-top:0;">查询结果</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>状态</th>
              <th>基金代码</th>
              <th>基金名称</th>
              <th>净值日期</th>
              <th>单位净值</th>
              <th>估算净值</th>
              <th>估算涨幅</th>
              <th>估算时间</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody id="fundTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="note">
        提示：如果在公司网络下抓取失败，但手机网络可以正常使用，通常是公司网络拦截了 workers.dev 域名。
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://long-feather-af2d.claricema.workers.dev/fund?codes=";

    let currentFunds = [];

    function $(id) {
      return document.getElementById(id);
    }

    function showStatus(message, type) {
      const box = $("statusBox");
      box.className = "status " + type;
      box.innerHTML = message;
    }

    function hideStatus() {
      const box = $("statusBox");
      box.className = "status";
      box.innerHTML = "";
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safe(value) {
      if (value === null || value === undefined || value === "" || value === "undefined") {
        return "-";
      }
      return String(value).trim() || "-";
    }

    function parseCodes(input) {
      return input
        .split(/[,，\s\n]+/)
        .map(x => x.trim())
        .filter(Boolean);
    }

    function normalizeFund(item) {
      item = item || {};

      return {
        success: item.success !== false,
        code: item.code || item.fundcode || item.fundCode || "-",
        name: item.name || item.fundName || "-",
        navDate: item.navDate || item.jzrq || "-",
        unitNav: item.unitNav || item.dwjz || item.nav || "-",
        estimateNav: item.estimateNav || item.gsz || "-",
        estimateRate: item.estimateRate || item.gszzl || item.rate || "-",
        updateTime: item.updateTime || item.gztime || "-",
        message: item.message || item.error || item.source || "-"
      };
    }

    function formatRate(rate) {
      if (!rate || rate === "-") return "-";
      const text = String(rate).trim();
      return text.endsWith("%") ? text : text + "%";
    }

    function rateClass(rate) {
      const n = parseFloat(String(rate).replace("%", ""));
      if (!Number.isFinite(n)) return "neutral";
      if (n > 0) return "positive";
      if (n < 0) return "negative";
      return "neutral";
    }

    async function loadFunds() {
      const input = $("fundCodes").value.trim();
      const codes = parseCodes(input);

      if (!codes.length) {
        showStatus("请输入至少一个基金代码。", "error");
        return;
      }

      const invalidCodes = codes.filter(code => !/^\d{6}$/.test(code));

      if (invalidCodes.length) {
        showStatus("以下基金代码格式不正确：" + invalidCodes.join(", ") + "。基金代码应为 6 位数字。", "error");
        return;
      }

      $("queryBtn").disabled = true;
      $("exportBtn").disabled = true;
      $("resultCard").style.display = "none";
      $("fundTableBody").innerHTML = "";
      currentFunds = [];

      showStatus("正在抓取数据，请稍候……", "info");

      try {
        const apiUrl = API_BASE + encodeURIComponent(codes.join(","));

        const response = await fetch(apiUrl, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const json = await response.json();

        console.log("Worker 返回：", json);

        if (!json.success) {
          throw new Error(json.message || json.error || "Worker 返回失败");
        }

        let rawFunds = [];

        if (Array.isArray(json.data)) {
          rawFunds = json.data;
        } else if (Array.isArray(json.results)) {
          rawFunds = json.results;
        } else if (Array.isArray(json)) {
          rawFunds = json;
        } else {
          throw new Error("API 返回格式不符合预期");
        }

        currentFunds = rawFunds.map(normalizeFund);

        renderFunds(currentFunds);

        $("resultCard").style.display = "block";
        $("exportBtn").disabled = currentFunds.length === 0;

        const successCount = currentFunds.filter(x => x.success).length;
        const failCount = currentFunds.length - successCount;

        if (failCount > 0) {
          showStatus("查询完成，其中 " + failCount + " 条失败。", "error");
        } else {
          showStatus("查询成功，共返回 " + successCount + " 条基金数据。", "success");
        }

      } catch (error) {
        console.error(error);
        showStatus("抓取失败：" + escapeHTML(error.message || String(error)), "error");
      } finally {
        $("queryBtn").disabled = false;
      }
    }

    function renderFunds(funds) {
      const tbody = $("fundTableBody");

      tbody.innerHTML = funds.map(fund => {
        const tag = fund.success
          ? '<span class="tag-ok">成功</span>'
          : '<span class="tag-fail">失败</span>';

        const rate = formatRate(fund.estimateRate);
        const cls = rateClass(fund.estimateRate);

        return `
          <tr>
            <td>${tag}</td>
            <td>${escapeHTML(safe(fund.code))}</td>
            <td>${escapeHTML(safe(fund.name))}</td>
            <td>${escapeHTML(safe(fund.navDate))}</td>
            <td>${escapeHTML(safe(fund.unitNav))}</td>
            <td>${escapeHTML(safe(fund.estimateNav))}</td>
            <td class="${cls}">${escapeHTML(rate)}</td>
            <td>${escapeHTML(safe(fund.updateTime))}</td>
            <td>${escapeHTML(safe(fund.message))}</td>
          </tr>
        `;
      }).join("");
    }

    function csvEscape(value) {
      if (value === null || value === undefined) return "";
      const s = String(value);
      if (/[",\n\r]/.test(s)) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function exportCSV() {
      if (!currentFunds.length) {
        showStatus("没有可导出的数据，请先查询。", "error");
        return;
      }

      const headers = [
        "状态",
        "基金代码",
        "基金名称",
        "净值日期",
        "单位净值",
        "估算净值",
        "估算涨幅",
        "估算时间",
        "备注"
      ];

      const rows = currentFunds.map(fund => [
        fund.success ? "成功" : "失败",
        safe(fund.code),
        safe(fund.name),
        safe(fund.navDate),
        safe(fund.unitNav),
        safe(fund.estimateNav),
        formatRate(fund.estimateRate),
        safe(fund.updateTime),
        safe(fund.message)
      ]);

      const csv = [
        headers.map(csvEscape).join(","),
        ...rows.map(row => row.map(csvEscape).join(","))
      ].join("\r\n");

      const now = new Date();
      const filename = "fund-data-" + now.getTime() + ".csv";

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);

      showStatus("CSV 已导出。", "success");
    }

    function clearAll() {
      $("fundCodes").value = "";
      currentFunds = [];
      $("fundTableBody").innerHTML = "";
      $("resultCard").style.display = "none";
      $("exportBtn").disabled = true;
      hideStatus();
    }
  </script>
</body>
</html>
