<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>基金持仓与涨幅对比工具</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f8fc;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: #1d4ed8;
    }

    .header p {
      margin: 0;
      color: #64748b;
      font-size: 15px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      border: 1px solid #e5edf7;
    }

    .input-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    input {
      flex: 1;
      min-width: 280px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: #10b981;
    }

    .secondary-btn:hover {
      background: #059669;
    }

    .light-btn {
      background: #e0ecff;
      color: #1d4ed8;
    }

    .light-btn:hover {
      background: #c7ddff;
    }

    .hint {
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      margin-top: 14px;
      color: #2563eb;
      font-weight: 500;
      font-size: 14px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
      background: #ffffff;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 600;
      padding: 13px 12px;
      text-align: left;
      border-bottom: 1px solid #dbeafe;
      font-size: 14px;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: top;
      font-size: 14px;
      color: #334155;
    }

    tr:hover td {
      background: #f8fbff;
    }

    .fund-name {
      font-weight: 600;
      color: #0f172a;
    }

    .code {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e0ecff;
      color: #1d4ed8;
      font-size: 12px;
    }

    .positive {
      color: #059669;
      font-weight: 700;
    }

    .negative {
      color: #dc2626;
      font-weight: 700;
    }

    .empty {
      color: #94a3b8;
    }

    .industry-tag {
      display: inline-block;
      padding: 3px 8px;
      margin: 2px 4px 2px 0;
      border-radius: 999px;
      background: #e0ecff;
      color: #1d4ed8;
      font-size: 12px;
    }

    .chart-box {
      height: 380px;
      margin-top: 10px;
    }

    canvas {
      background: #ffffff;
      border-radius: 12px;
    }

    .summary {
      line-height: 1.8;
      color: #475569;
      font-size: 15px;
    }

    .summary strong {
      color: #1d4ed8;
    }

    .analysis-box {
      margin-top: 14px;
      padding: 14px;
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      .header h1 {
        font-size: 24px;
      }

      button {
        width: 100%;
      }

      input {
        min-width: 100%;
      }

      .chart-box {
        height: 320px;
      }

      table {
        min-width: 1100px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📈 基金持仓与涨幅对比工具</h1>
    <p>输入多个基金代码，自动抓取基金名称、近一个月涨幅及前五大持仓，并生成对比表、图表和简易分析。</p>
  </div>

  <div class="card">
    <h3>输入基金代码</h3>

    <div class="input-area">
      <input
        id="fundCodes"
        placeholder="例如：012348,161725,000001"
      />

      <button onclick="loadFunds()">确定</button>

      <button class="secondary-btn" onclick="exportExcel()">导出 Excel</button>

      <button class="light-btn" onclick="exportCSV()">导出 CSV</button>
    </div>

    <div class="hint">
      多个基金代码请使用英文逗号 <strong>,</strong> 分隔。
      示例：<strong>012348,161725,000001</strong>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>📋 基金对比表</h2>
    <div id="tableContainer">
      <p class="empty">请输入基金代码后点击“确定”。</p>
    </div>
  </div>

  <div class="card">
    <h2>📊 近一个月涨幅比较</h2>
    <div class="chart-box">
      <canvas id="growthChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>🤖 AI 简易分析</h2>
    <div id="summary" class="summary">
      请输入基金代码后点击“确定”生成分析。
    </div>
  </div>

</div>

<script>
  const API_BASE = "https://long-feather-af2d.claricema.workers.dev";

  let fundData = [];
  let growthChart = null;

  const INDUSTRY_MAP = {
    "贵州茅台": "食品饮料 / 白酒",
    "五粮液": "食品饮料 / 白酒",
    "泸州老窖": "食品饮料 / 白酒",
    "山西汾酒": "食品饮料 / 白酒",
    "洋河股份": "食品饮料 / 白酒",
    "古井贡酒": "食品饮料 / 白酒",
    "今世缘": "食品饮料 / 白酒",
    "舍得酒业": "食品饮料 / 白酒",
    "迎驾贡酒": "食品饮料 / 白酒",

    "腾讯控股": "互联网 / 科技",
    "美团-W": "互联网 / 消费服务",
    "阿里巴巴-W": "互联网 / 电商",
    "网易-S": "互联网 / 游戏",
    "快手-W": "互联网 / 内容平台",
    "小米集团-W": "消费电子 / 科技",

    "中芯国际": "半导体",
    "北方华创": "半导体设备",
    "海光信息": "半导体 / AI芯片",
    "寒武纪-U": "半导体 / AI芯片",
    "兆易创新": "半导体",

    "宁德时代": "新能源 / 电池",
    "比亚迪": "新能源车",
    "比亚迪股份": "新能源车",
    "隆基绿能": "新能源 / 光伏",
    "阳光电源": "新能源 / 光伏逆变器",
    "亿纬锂能": "新能源 / 电池",
    "天齐锂业": "新能源 / 锂资源",
    "赣锋锂业": "新能源 / 锂资源",

    "恒瑞医药": "医药生物",
    "迈瑞医疗": "医疗器械",
    "药明康德": "医药外包 / CXO",
    "爱尔眼科": "医疗服务",
    "片仔癀": "中药",

    "招商银行": "银行",
    "平安银行": "银行",
    "兴业银行": "银行",
    "工商银行": "银行",
    "中国平安": "保险",
    "东方财富": "金融科技 / 券商",

    "伊利股份": "食品饮料 / 乳制品",
    "海天味业": "食品饮料 / 调味品",
    "美的集团": "家电",
    "格力电器": "家电",
    "海尔智家": "家电",

    "立讯精密": "电子制造",
    "工业富联": "电子制造 / AI服务器",
    "汇川技术": "工业自动化",
    "三一重工": "工程机械",
    "中国中车": "高端装备"
  };

  function getIndustry(stockName) {
    if (!stockName) {
      return "其他 / 未识别";
    }

    if (INDUSTRY_MAP[stockName]) {
      return INDUSTRY_MAP[stockName];
    }

    if (stockName.includes("茅台") || stockName.includes("五粮液") || stockName.includes("汾酒") || stockName.includes("老窖") || stockName.includes("洋河")) {
      return "食品饮料 / 白酒";
    }

    if (stockName.includes("腾讯") || stockName.includes("美团") || stockName.includes("阿里") || stockName.includes("网易") || stockName.includes("快手")) {
      return "互联网 / 科技";
    }

    if (stockName.includes("中芯") || stockName.includes("芯") || stockName.includes("半导体")) {
      return "半导体";
    }

    if (stockName.includes("宁德") || stockName.includes("比亚迪") || stockName.includes("锂") || stockName.includes("光伏") || stockName.includes("新能源")) {
      return "新能源";
    }

    if (stockName.includes("银行")) {
      return "银行";
    }

    if (stockName.includes("医药") || stockName.includes("医疗") || stockName.includes("药明") || stockName.includes("恒瑞")) {
      return "医药生物";
    }

    return "其他 / 未识别";
  }

  function getIndustrySummary(fund) {
    const industryCounter = {};

    (fund.holdings || []).forEach(function(item) {
      const industry = getIndustry(item.stock);

      if (!industryCounter[industry]) {
        industryCounter[industry] = 0;
      }

      industryCounter[industry]++;
    });

    return Object.entries(industryCounter).sort(function(a, b) {
      return b[1] - a[1];
    });
  }

  function getFundStyleByIndustries(industrySummary) {
    if (!industrySummary || industrySummary.length === 0) {
      return "暂无明显风格";
    }

    const topIndustry = industrySummary[0][0];

    if (topIndustry.includes("白酒") || topIndustry.includes("食品饮料")) {
      return "消费 / 白酒集中型";
    }

    if (topIndustry.includes("互联网") || topIndustry.includes("科技") || topIndustry.includes("半导体")) {
      return "科技成长型";
    }

    if (topIndustry.includes("新能源")) {
      return "新能源成长型";
    }

    if (topIndustry.includes("银行") || topIndustry.includes("保险")) {
      return "金融价值型";
    }

    if (topIndustry.includes("医药")) {
      return "医药主题型";
    }

    return "均衡或混合风格";
  }

  async function loadFunds() {
    const input = document.getElementById("fundCodes").value;

    const codes = input
      .split(",")
      .map(function(x) {
        return x.trim();
      })
      .filter(function(x) {
        return x;
      });

    if (codes.length === 0) {
      alert("请输入基金代码，例如：012348,161725,000001");
      return;
    }

    const invalidCodes = codes.filter(function(code) {
      return !/^\d{6}$/.test(code);
    });

    if (invalidCodes.length > 0) {
      alert("以下基金代码格式不正确，请输入6位数字代码：" + invalidCodes.join(", "));
      return;
    }

    document.getElementById("status").innerHTML =
      "⏳ 正在抓取基金数据，请稍候...";

    try {
      const apiUrl =
        API_BASE.replace(/\/$/, "") +
        "/fund?codes=" +
        encodeURIComponent(codes.join(","));

      const response = await fetch(apiUrl);
      const json = await response.json();

      if (!json.success) {
        throw new Error(json.message || "API返回失败");
      }

      fundData = json.data || [];

      renderTable();
      renderChart();
      renderSummary();

      document.getElementById("status").innerHTML =
        "✅ 数据抓取完成，共分析 " + fundData.length + " 支基金";

    } catch (error) {
      console.error(error);

      document.getElementById("status").innerHTML =
        "❌ 数据抓取失败：" + error.message;
    }
  }

  function renderTable() {
    if (fundData.length === 0) {
      document.getElementById("tableContainer").innerHTML =
        '<p class="empty">暂无数据。</p>';
      return;
    }

    let html = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>基金名称</th>
              <th>基金代码</th>
              <th>近一个月涨幅</th>
              <th>持仓1</th>
              <th>比例1</th>
              <th>行业1</th>
              <th>持仓2</th>
              <th>比例2</th>
              <th>行业2</th>
              <th>持仓3</th>
              <th>比例3</th>
              <th>行业3</th>
              <th>持仓4</th>
              <th>比例4</th>
              <th>行业4</th>
              <th>持仓5</th>
              <th>比例5</th>
              <th>行业5</th>
            </tr>
          </thead>
          <tbody>
    `;

    fundData.forEach(function(fund) {
      const holdings = fund.holdings || [];

      const growthDisplay =
        fund.growth === null || isNaN(fund.growth)
          ? '<span class="empty">暂无数据</span>'
          : `<span class="${Number(fund.growth) >= 0 ? "positive" : "negative"}">${Number(fund.growth).toFixed(2)}%</span>`;

      html += `
        <tr>
          <td>
            <div class="fund-name">${fund.name}</div>
            ${fund.error ? `<div class="empty">${fund.error}</div>` : ""}
          </td>
          <td>
            <span class="code">${fund.code}</span>
          </td>
          <td>${growthDisplay}</td>
      `;

      for (let i = 0; i < 5; i++) {
        const item = holdings[i];

        if (item) {
          html += `
            <td>${item.stock}</td>
            <td>${item.ratio}</td>
            <td><span class="industry-tag">${getIndustry(item.stock)}</span></td>
          `;
        } else {
          html += `
            <td class="empty">暂无</td>
            <td class="empty">暂无</td>
            <td class="empty">暂无</td>
          `;
        }
      }

      html += `</tr>`;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    document.getElementById("tableContainer").innerHTML = html;
  }

  function renderChart() {
    const ctx = document.getElementById("growthChart");

    const labels = fundData.map(function(fund) {
      return fund.name || fund.code;
    });

    const data = fundData.map(function(fund) {
      return fund.growth === null || isNaN(fund.growth)
        ? 0
        : Number(fund.growth);
    });

    if (growthChart) {
      growthChart.destroy();
    }

    if (typeof Chart === "undefined") {
      document.getElementById("status").innerHTML +=
        "；图表组件未加载，但表格数据可正常使用。";
      return;
    }

    growthChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            label: "近一个月涨幅 (%)",
            data: data,
            backgroundColor: data.map(function(value) {
              return value >= 0 ? "#34d399" : "#f87171";
            }),
            borderRadius: 8
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return "近一个月涨幅：" + context.raw + "%";
              }
            }
          }
        },
        scales: {
          y: {
            ticks: {
              callback: function(value) {
                return value + "%";
              }
            }
          }
        }
      }
    });
  }

  function renderSummary() {
    if (fundData.length === 0) {
      document.getElementById("summary").innerHTML =
        "请输入基金代码后点击“确定”生成分析。";
      return;
    }

    const validGrowth = fundData
      .map(function(fund) {
        return fund.growth;
      })
      .filter(function(x) {
        return x !== null && !isNaN(x);
      });

    const avgGrowth =
      validGrowth.length > 0
        ? validGrowth.reduce(function(a, b) {
            return Number(a) + Number(b);
          }, 0) / validGrowth.length
        : null;

    const stockCounter = {};
    const industryCounter = {};
    let fundIndustryHtml = "";

    fundData.forEach(function(fund) {
      const industrySummary = getIndustrySummary(fund);
      const fundStyle = getFundStyleByIndustries(industrySummary);

      fundIndustryHtml += `
        <div class="analysis-box">
          <p style="margin:0 0 8px;">
            <strong>${fund.name}</strong>
            <span class="industry-tag">${fundStyle}</span>
          </p>

          <p style="margin:6px 0;color:#475569;">
            主要行业：
            ${
              industrySummary.length > 0
                ? industrySummary.map(function(item) {
                    return item[0] + "（" + item[1] + "项持仓）";
                  }).join("、")
                : "暂无可识别行业"
            }
          </p>

          <p style="margin:6px 0;color:#64748b;font-size:14px;">
            前五持仓行业明细：
            ${
              (fund.holdings || []).length > 0
                ? (fund.holdings || []).map(function(item) {
                    return item.stock + "：" + getIndustry(item.stock);
                  }).join("；")
                : "暂无持仓数据"
            }
          </p>
        </div>
      `;

      (fund.holdings || []).forEach(function(item) {
        if (!stockCounter[item.stock]) {
          stockCounter[item.stock] = 0;
        }

        stockCounter[item.stock]++;

        const industry = getIndustry(item.stock);

        if (!industryCounter[industry]) {
          industryCounter[industry] = 0;
        }

        industryCounter[industry]++;
      });
    });

    const overlapStocks = Object.entries(stockCounter)
      .filter(function(item) {
        return item[1] >= 2;
      })
      .map(function(item) {
        return item[0];
      });

    const topIndustries = Object.entries(industryCounter)
      .sort(function(a, b) {
        return b[1] - a[1];
      })
      .slice(0, 5);

    let bestFund = null;

    fundData.forEach(function(fund) {
      if (fund.growth !== null && !isNaN(fund.growth)) {
        if (!bestFund || Number(fund.growth) > Number(bestFund.growth)) {
          bestFund = fund;
        }
      }
    });

    let concentrationComment = "";

    if (topIndustries.length > 0) {
      const topIndustryCount = topIndustries[0][1];
      const totalHoldingCount = Object.values(industryCounter).reduce(function(a, b) {
        return a + b;
      }, 0);

      const concentrationRatio = totalHoldingCount > 0
        ? topIndustryCount / totalHoldingCount
        : 0;

      if (concentrationRatio >= 0.5) {
        concentrationComment =
          "当前组合行业集中度较高，主要集中在 " + topIndustries[0][0] + "，波动可能受单一板块影响较大。";
      } else if (concentrationRatio >= 0.3) {
        concentrationComment =
          "当前组合存在一定行业偏向，主要集中在 " + topIndustries[0][0] + "，但仍有一定分散度。";
      } else {
        concentrationComment =
          "当前组合行业分布相对分散，单一行业集中度不算明显。";
      }
    } else {
      concentrationComment = "当前行业识别信息有限，建议结合基金季报进一步确认。";
    }

    document.getElementById("summary").innerHTML = `
      <p>✅ 当前共分析 <strong>${fundData.length}</strong> 支基金。</p>

      <p>
        📈 平均近一个月涨幅：
        <strong>
          ${avgGrowth === null ? "暂无数据" : avgGrowth.toFixed(2) + "%"}
        </strong>
      </p>

      <p>
        🏆 近一个月表现相对较好的基金：
        <strong>
          ${bestFund ? bestFund.name + "（" + Number(bestFund.growth).toFixed(2) + "%）" : "暂无数据"}
        </strong>
      </p>

      <p>
        🔁 多基金共同重仓股：
        <strong>
          ${overlapStocks.length > 0 ? overlapStocks.join("、") : "暂无明显重合"}
        </strong>
      </p>

      <p>
        🧭 组合主要行业分布：
        <strong>
          ${
            topIndustries.length > 0
              ? topIndustries.map(function(item) {
                  return item[0] + "（" + item[1] + "次）";
                }).join("、")
              : "暂无可识别行业"
          }
        </strong>
      </p>

      <p>
        💡 简单建议：
        ${concentrationComment}
        如果多个基金重仓行业或个股高度重合，组合表面上买了多只基金，但实际分散效果可能有限。
        可以考虑搭配不同风格基金，例如消费、科技、医药、宽基指数或债券类产品，以降低单一行业波动影响。
      </p>

      <h3 style="margin-top:22px;color:#1d4ed8;">📌 各基金主要持仓行业分析</h3>

      ${fundIndustryHtml}

      <p style="color:#94a3b8;font-size:13px;margin-top:18px;">
        注：以上行业分类为基于主要持仓名称的简易识别，仅供公开数据整理和比较参考，不构成任何投资建议。
      </p>
    `;
  }

  function exportExcel() {
    if (fundData.length === 0) {
      alert("请先点击“确定”生成数据");
      return;
    }

    if (typeof XLSX === "undefined") {
      alert("Excel导出组件加载失败，请使用CSV导出");
      return;
    }

    const rows = fundData.map(function(fund) {
      const row = {
        基金名称: fund.name,
        基金代码: fund.code,
        近一个月涨幅:
          fund.growth === null || isNaN(fund.growth)
            ? "暂无数据"
            : Number(fund.growth).toFixed(2) + "%"
      };

      for (let i = 0; i < 5; i++) {
        const item = fund.holdings[i];

        row["持仓" + (i + 1)] = item ? item.stock : "";
        row["比例" + (i + 1)] = item ? item.ratio : "";
        row["行业" + (i + 1)] = item ? getIndustry(item.stock) : "";
      }

      return row;
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "基金对比");
    XLSX.writeFile(wb, "基金持仓与涨幅对比.xlsx");
  }

  function exportCSV() {
    if (fundData.length === 0) {
      alert("请先点击“确定”生成数据");
      return;
    }

    const headers = [
      "基金名称",
      "基金代码",
      "近一个月涨幅",
      "持仓1",
      "比例1",
      "行业1",
      "持仓2",
      "比例2",
      "行业2",
      "持仓3",
      "比例3",
      "行业3",
      "持仓4",
      "比例4",
      "行业4",
      "持仓5",
      "比例5",
      "行业5"
    ];

    const rows = fundData.map(function(fund) {
      const row = [
        fund.name,
        fund.code,
        fund.growth === null || isNaN(fund.growth)
          ? "暂无数据"
          : Number(fund.growth).toFixed(2) + "%"
      ];

      for (let i = 0; i < 5; i++) {
        const item = fund.holdings[i];

        row.push(item ? item.stock : "");
        row.push(item ? item.ratio : "");
        row.push(item ? getIndustry(item.stock) : "");
      }

      return row;
    });

    let csv = headers.join(",") + "\n";

    rows.forEach(function(row) {
      csv +=
        row
          .map(function(value) {
            return '"' + String(value).replace(/"/g, '""') + '"';
          })
          .join(",") + "\n";
    });

    const blob = new Blob(["\ufeff" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "基金持仓与涨幅对比.csv";
    link.click();
  }

  document.getElementById("fundCodes").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      loadFunds();
    }
  });
</script>

</body>
</html>
