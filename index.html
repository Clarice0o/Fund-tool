<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Fund Tool - 基金持仓与涨幅查询</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 1180px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .desc {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      resize: vertical;
      box-sizing: border-box;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .summary-box {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 12px;
      padding: 14px;
    }

    .summary-label {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 700;
    }

    .fund-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
      background: #fff;
    }

    .fund-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .fund-title {
      font-size: 18px;
      font-weight: 700;
    }

    .fund-code {
      color: #6b7280;
      font-size: 13px;
      margin-top: 4px;
    }

    .tag-ok {
      background: #dcfce7;
      color: #166534;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-block;
    }

    .tag-fail {
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .info-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px;
    }

    .info-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 700;
    }

    .positive {
      color: #dc2626;
      font-weight: 700;
    }

    .negative {
      color: #16a34a;
      font-weight: 700;
    }

    .neutral {
      color: #4b5563;
      font-weight: 700;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
    }

    .ai-box {
      background: #f8fafc;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      padding: 13px;
      line-height: 1.7;
      font-size: 14px;
      color: #1f2937;
    }

    .ai-box strong {
      color: #1d4ed8;
    }

    .note {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .container {
        margin: 18px auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
      <h1>Fund Tool - 基金持仓与涨幅查询</h1>
      <div class="desc">
        输入基金代码，查询实时估值、近一个月涨幅、前五主要持仓，并生成简单 AI 分析。
        <br />
        多个代码可以用逗号、空格或换行分隔，例如：012348, 000001, 161725
      </div>

      <textarea id="fundCodes" placeholder="请输入基金代码，例如：012348, 000001, 161725"></textarea>

      <div class="buttons">
        <button class="primary" id="queryBtn" onclick="loadFunds()">查询基金</button>
        <button class="secondary" id="exportBtn" onclick="exportCSV()" disabled>导出 CSV</button>
        <button class="danger" onclick="clearAll()">清空</button>
      </div>

      <div id="statusBox" class="status"></div>
    </div>

    <div class="card" id="summaryCard" style="display:none;">
      <h2>查询概览</h2>
      <div class="summary-grid">
        <div class="summary-box">
          <div class="summary-label">基金数量</div>
          <div class="summary-value" id="totalCount">0</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">成功数量</div>
          <div class="summary-value" id="successCount">0</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">失败数量</div>
          <div class="summary-value" id="failCount">0</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">页面更新时间</div>
          <div class="summary-value" id="lastUpdate" style="font-size:14px;">-</div>
        </div>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <h2>查询结果</h2>
      <div id="fundList"></div>
    </div>

    <div class="card">
      <div class="note">
        说明：数据来源于天天基金 / 东方财富公开数据。实时估值和简易 AI 分析仅供参考，不构成投资建议。
        如果公司网络无法访问，通常是 workers.dev 被公司网络拦截，可使用手机热点或后续绑定自定义域名。
      </div>
    </div>

  </div>

  <script>
    const API_BASE = "https://long-feather-af2d.claricema.workers.dev/fund?codes=";

    let currentFunds = [];

    function $(id) {
      return document.getElementById(id);
    }

    function showStatus(message, type) {
      const box = $("statusBox");
      box.className = "status " + type;
      box.innerHTML = message;
    }

    function hideStatus() {
      const box = $("statusBox");
      box.className = "status";
      box.innerHTML = "";
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safe(value) {
      if (value === null || value === undefined || value === "" || value === "undefined") return "-";
      return String(value).trim() || "-";
    }

    function parseCodes(input) {
      return input
        .split(/[,，\s\n]+/)
        .map(x => x.trim())
        .filter(Boolean);
    }

    function normalizeFund(item) {
      item = item || {};

      return {
        success: item.success !== false,
        code: item.code || item.fundcode || "-",
        name: item.name || item.fundName || "-",
        navDate: item.navDate || item.jzrq || "-",
        unitNav: item.unitNav || item.dwjz || "-",
        estimateNav: item.estimateNav || item.gsz || "-",
        estimateRate: item.estimateRate || item.gszzl || "-",
        updateTime: item.updateTime || item.gztime || "-",
        monthReturnText: item.monthReturnText || "-",
        monthWindow: item.monthWindow || "-",
        holdingsAsOf: item.holdingsAsOf || "-",
        holdingsTop5: Array.isArray(item.holdingsTop5) ? item.holdingsTop5 : [],
        aiSummary: item.aiSummary || null,
        message: item.message || item.error || item.source || "-"
      };
    }

    function formatRate(rate) {
      if (!rate || rate === "-") return "-";
      const text = String(rate).trim();
      return text.endsWith("%") ? text : text + "%";
    }

    function rateClass(rate) {
      const n = parseFloat(String(rate).replace("%", ""));
      if (!Number.isFinite(n)) return "neutral";
      if (n > 0) return "positive";
      if (n < 0) return "negative";
      return "neutral";
    }

    async function loadFunds() {
      const input = $("fundCodes").value.trim();
      const codes = parseCodes(input);

      if (!codes.length) {
        showStatus("请输入至少一个基金代码。", "error");
        return;
      }

      const invalidCodes = codes.filter(code => !/^\d{6}$/.test(code));

      if (invalidCodes.length) {
        showStatus("以下基金代码格式不正确：" + invalidCodes.join(", ") + "。基金代码应为 6 位数字。", "error");
        return;
      }

      $("queryBtn").disabled = true;
      $("exportBtn").disabled = true;
      $("summaryCard").style.display = "none";
      $("resultCard").style.display = "none";
      $("fundList").innerHTML = "";
      currentFunds = [];

      showStatus("正在抓取实时估值、持仓和近一个月净值数据，请稍候……", "info");

      try {
        const apiUrl = API_BASE + encodeURIComponent(codes.join(","));

        const response = await fetch(apiUrl, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const json = await response.json();

        console.log("Worker 返回：", json);

        if (!json.success) {
          throw new Error(json.message || json.error || "Worker 返回失败");
        }

        let rawFunds = [];

        if (Array.isArray(json.data)) {
          rawFunds = json.data;
        } else if (Array.isArray(json.results)) {
          rawFunds = json.results;
        } else if (Array.isArray(json)) {
          rawFunds = json;
        } else {
          throw new Error("API 返回格式不符合预期");
        }

        currentFunds = rawFunds.map(normalizeFund);

        renderFunds(currentFunds);

        const successCount = currentFunds.filter(x => x.success).length;
        const failCount = currentFunds.length - successCount;

        $("totalCount").textContent = String(currentFunds.length);
        $("successCount").textContent = String(successCount);
        $("failCount").textContent = String(failCount);
        $("lastUpdate").textContent = new Date().toLocaleString("zh-CN");

        $("summaryCard").style.display = "block";
        $("resultCard").style.display = "block";
        $("exportBtn").disabled = currentFunds.length === 0;

        if (failCount > 0) {
          showStatus("查询完成，其中 " + failCount + " 条失败。", "error");
        } else {
          showStatus("查询成功，共返回 " + successCount + " 条基金数据。", "success");
        }

      } catch (error) {
        console.error(error);
        showStatus("抓取失败：" + escapeHTML(error.message || String(error)), "error");
      } finally {
        $("queryBtn").disabled = false;
      }
    }

    function renderFunds(funds) {
      const container = $("fundList");

      container.innerHTML = funds.map(fund => {
        const tag = fund.success
          ? '<span class="tag-ok">成功</span>'
          : '<span class="tag-fail">失败</span>';

        const estimateRateText = formatRate(fund.estimateRate);
        const estimateRateClass = rateClass(fund.estimateRate);
        const monthRateClass = rateClass(fund.monthReturnText);

        const holdingsHtml = renderHoldingsTable(fund.holdingsTop5);

        const ai = fund.aiSummary || {};
        const aiHtml = `
          <div class="ai-box">
            <div><strong>趋势：</strong>${escapeHTML(safe(ai.trend || "-"))}</div>
            <div><strong>风险：</strong>${escapeHTML(safe(ai.risk || "-"))}</div>
            <div><strong>建议：</strong>${escapeHTML(safe(ai.action || "-"))}</div>
            <div style="color:#6b7280;font-size:12px;margin-top:6px;">${escapeHTML(safe(ai.disclaimer || "仅供参考，不构成投资建议。"))}</div>
          </div>
        `;

        return `
          <div class="fund-card">
            <div class="fund-header">
              <div>
                <div class="fund-title">${escapeHTML(safe(fund.name))}</div>
                <div class="fund-code">基金代码：${escapeHTML(safe(fund.code))}</div>
              </div>
              <div>${tag}</div>
            </div>

            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">净值日期</div>
                <div class="info-value">${escapeHTML(safe(fund.navDate))}</div>
              </div>
              <div class="info-item">
                <div class="info-label">单位净值</div>
                <div class="info-value">${escapeHTML(safe(fund.unitNav))}</div>
              </div>
              <div class="info-item">
                <div class="info-label">估算净值</div>
                <div class="info-value">${escapeHTML(safe(fund.estimateNav))}</div>
              </div>
              <div class="info-item">
                <div class="info-label">估算涨幅</div>
                <div class="info-value ${estimateRateClass}">${escapeHTML(estimateRateText)}</div>
              </div>
              <div class="info-item">
                <div class="info-label">近一个月涨幅</div>
                <div class="info-value ${monthRateClass}">${escapeHTML(safe(fund.monthReturnText))}</div>
              </div>
              <div class="info-item">
                <div class="info-label">近一月区间</div>
                <div class="info-value" style="font-size:13px;">${escapeHTML(safe(fund.monthWindow))}</div>
              </div>
            </div>

            <div class="section-title">前五主要持仓（报告期：${escapeHTML(safe(fund.holdingsAsOf))}）</div>
            ${holdingsHtml}

            <div class="section-title">简单 AI 分析</div>
            ${aiHtml}
          </div>
        `;
      }).join("");
    }

    function renderHoldingsTable(items) {
      if (!items || !items.length) {
        return '<div class="note">未获取到前五持仓数据，可能该基金暂无股票持仓或公开接口未返回。</div>';
      }

      const rows = items.map((h, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHTML(safe(h.stockCode))}</td>
          <td>${escapeHTML(safe(h.stockName))}</td>
          <td>${escapeHTML(safe(h.weight))}</td>
          <td>${escapeHTML(safe(h.shares))}</td>
          <td>${escapeHTML(safe(h.marketValue))}</td>
        </tr>
      `).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>股票代码</th>
                <th>股票名称</th>
                <th>占净值比</th>
                <th>持股数</th>
                <th>持仓市值</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function csvEscape(value) {
      if (value === null || value === undefined) return "";
      const s = String(value);
      if (/[",\n\r]/.test(s)) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function exportCSV() {
      if (!currentFunds.length) {
        showStatus("没有可导出的数据，请先查询。", "error");
        return;
      }

      const headers = [
        "基金代码",
        "基金名称",
        "净值日期",
        "单位净值",
        "估算净值",
        "估算涨幅",
        "近一个月涨幅",
        "近一月区间",
        "持仓报告期",
        "持仓序号",
        "股票代码",
        "股票名称",
        "占净值比",
        "持股数",
        "持仓市值",
        "AI趋势",
        "AI风险",
        "AI建议"
      ];

      const rows = [];

      currentFunds.forEach(fund => {
        const holdings = fund.holdingsTop5 && fund.holdingsTop5.length
          ? fund.holdingsTop5
          : [{}];

        holdings.forEach((h, index) => {
          rows.push([
            safe(fund.code),
            safe(fund.name),
            safe(fund.navDate),
            safe(fund.unitNav),
            safe(fund.estimateNav),
            formatRate(fund.estimateRate),
            safe(fund.monthReturnText),
            safe(fund.monthWindow),
            safe(fund.holdingsAsOf),
            h.stockCode ? index + 1 : "",
            safe(h.stockCode || ""),
            safe(h.stockName || ""),
            safe(h.weight || ""),
            safe(h.shares || ""),
            safe(h.marketValue || ""),
            safe(fund.aiSummary && fund.aiSummary.trend),
            safe(fund.aiSummary && fund.aiSummary.risk),
            safe(fund.aiSummary && fund.aiSummary.action)
          ]);
        });
      });

      const csv = [
        headers.map(csvEscape).join(","),
        ...rows.map(row => row.map(csvEscape).join(","))
      ].join("\r\n");

      const now = new Date();
      const filename = "fund-full-data-" + now.getTime() + ".csv";

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);

      showStatus("CSV 已导出。", "success");
    }

    function clearAll() {
      $("fundCodes").value = "";
      currentFunds = [];
      $("fundList").innerHTML = "";
      $("summaryCard").style.display = "none";
      $("resultCard").style.display = "none";
      $("exportBtn").disabled = true;
      hideStatus();
    }
  </script>
</body>
</html>
